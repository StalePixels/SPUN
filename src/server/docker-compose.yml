services:
  spun-server:
    build:
      context: ..
      dockerfile: server/Dockerfile
    env_file: ${SPUN_ENV_FILE:-.env}
    environment:
      NBN_FILEPATH: /data
    ports:
      - "${SPUN_PORT:-48128}:48128"
    volumes:
      - "${DATA_DIR_HOST:?set DATA_DIR_HOST in .env}:/data:ro"
    restart: unless-stopped
