services:
  cms:
    build:
      context: .
      additional_contexts:
        client: ../client
    env_file: ${CMS_ENV_FILE:-.env}
    ports:
      - "${CMS_PORT:-48180}:3000"
    volumes:
      - "${STORAGE_DIR_HOST:?set STORAGE_DIR_HOST in .env}:${STORAGE_DIR:-/storage}"
    restart: unless-stopped
